<!DOCTYPE html>

    <title>Elegance - Premium Women's Fashion</title>
    <meta name="description" content="Discover Elegance, the premium women's fashion and accessories brand. Shop our latest collection of casual, formal, jewelry, and accessories.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
